name: Preserve portrait and generate share preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/preserve-portrait.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  save-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Prepare image tooling
        run: python -m pip install --quiet Pillow
      - name: Preserve current edited portrait and make Open Graph image
        run: |
          python - <<'PY'
          from pathlib import Path
          from html import unescape
          from io import BytesIO
          import re
          from urllib.request import Request, urlopen
          from PIL import Image, ImageDraw, ImageFont, ImageOps
          source = Path("index.html").read_text(encoding="utf-8")
          hit = re.search(r'<img\s+class="hero-image"\s+src="([^"]+)"',source)
          if not hit:
              raise RuntimeError("Edited hero portrait URL could not be found")
          url = unescape(hit.group(1))
          request = Request(url, headers={"User-Agent": "Mozilla/5.0 (compatible; PortfolioAssetArchiver/1.0)"})
          with urlopen(request, timeout=50) as response:
              data = response.read(15000001)
          if len(data) > 15000000:
              raise RuntimeError("Portrait exceeds 15 MB")
          pic = Image.open(BytesIO(data))
          pic.load()
          if pic.width < 350 or pic.height < 350:
              raise RuntimeError("Portrait is too small for preview")
          pic = ImageOps.exif_transpose(pic).convert("RGB")
          pic.thumbnail((1800, 1800), Image.Resampling.LANCZOS)
          Path("assets").mkdir(exist_ok=True)
          pic.save("assets/fahim-edited-portrait.jpg", "JPEG", quality=88, optimize=True, progressive=True)
          w, h = 1200, 630
          card = Image.new("RGB", (w,h), (24, 29, 41))
          d = ImageDraw.Draw(card)
          for y in range(h):
              t = y/h
              d.line(((0,y),(w,y)),fill=(int(23+8*t),int(27+4*t),int(42+4*t)),width=1)
          right = ImageOps.fit(pic, (520,630), method=Image.Resampling.LANCZOS, centering=(.5,.30))
          card.paste(right, (680,0))
          overlay = Image.new("RGBA", (w,h), (0,0,0,0))
          od = ImageDraw.Draw(overlay)
          for x in range(570,810):
              alpha = round(255 * (810-x)/240)
              od.line(((x,0),(x,h)), fill=(24,29,42,alpha))
          card = Image.alpha_composite(card.convert("RGBA"), overlay).convert("RGB")
          d = ImageDraw.Draw(card)
          font_bold="/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          font_reg="/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
          f_big=ImageFont.truetype(font_bold,76)
          f_med=ImageFont.truetype(font_bold,29)
          f_small=ImageFont.truetype(font_reg,22)
          d.rounded_rectangle((62,68,224,103),radius=17,fill=(62,81,180))
          d.text((84,75),"PORTFOLIO",font=ImageFont.truetype(font_bold,17),fill="#ffffff")
          d.text((60,210),"Fahim Sikder",font=f_big,fill="#ffffff")
          d.text((62,324),"Web Developer &",font=f_med,fill="#dce5ff")
          d.text((62,367),"AI Solutions Builder",font=f_med,fill="#dce5ff")
          d.line((62,449,542,449),fill="#7785ab",width=2)
          d.text((62,478),"Custom Websites  |  E-commerce  |  SEO",font=f_small,fill="#cad4ef")
          d.text((62,561),"fahimsikderai.com",font=ImageFont.truetype(font_bold,21),fill="#a9bafa")
          card.save("assets/social-preview.jpg","JPEG",quality=86,optimize=True,progressive=True,subsampling=0)
          print("Created assets/fahim-edited-portrait.jpg and assets/social-preview.jpg")
          PY
      - name: Save assets and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fahim-edited-portrait.jpg assets/social-preview.jpg
          git rm .github/workflows/preserve-portrait.yml
          git commit -m "Preserve edited portrait and add social sharing image"
          git push
