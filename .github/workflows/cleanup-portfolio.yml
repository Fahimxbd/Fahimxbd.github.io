name: Clean portfolio sections

on:
  push:
    paths:
      - ".github/workflows/cleanup-portfolio.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Remove unwanted education and project cards
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          timeline_pattern = re.compile(
              r'\s*<div class="timeline-item">(?:(?!<div class="timeline-item">).)*?'
              r'(?:Secondary School Certificate|Nalgao High School|GPA 4\.72)'
              r'(?:(?!<div class="timeline-item">).)*?</article>\s*</div>',
              re.IGNORECASE | re.DOTALL,
          )

          project_pattern = re.compile(
              r'\s*<article class="card project-card">'
              r'(?:(?!<article class="card project-card">).)*?'
              r'(?:AI by Fahim|Chinta AI)'
              r'(?:(?!<article class="card project-card">).)*?</article>',
              re.IGNORECASE | re.DOTALL,
          )

          text = timeline_pattern.sub("", text)
          text = project_pattern.sub("", text)

          forbidden = [
              "Secondary School Certificate",
              "Nalgao High School",
              "GPA 4.72",
              "AI by Fahim",
              "Chinta AI",
          ]
          for phrase in forbidden:
              text = text.replace(phrase, "")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit cleaned portfolio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Remove SSC and unwanted AI project cards"
            git push
          fi
